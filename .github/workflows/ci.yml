name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test (release.yml passes the pinned release tag)'
        required: false
        type: string
        default: ''
      version:
        description: 'Version in the archive names (release.yml passes the release version)'
        required: false
        type: string
        default: '0.0.0-ci'

jobs:
  test:
    name: C tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -- --nocapture

  check-header-drift:
    name: Verify minigraf.h is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.2 --locked
      - name: Regenerate header
        run: |
          cbindgen --config cbindgen.toml \
                   --crate minigraf-c-shim \
                   --output /tmp/minigraf_generated.h
      - name: Fail if header has drifted
        run: |
          diff include/minigraf.h /tmp/minigraf_generated.h || \
          (echo "minigraf.h is out of date — run cbindgen locally and commit the result" && exit 1)

  package:
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version || '0.0.0-ci' }}

  # Unpacks this platform's archive and compiles and runs the README quick
  # start and the consumer contract against it, as a user would.
  consumer:
    name: Consumer test (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Run consumer test
        shell: bash
        run: bash consumer-test/run.sh local dist ${{ inputs.version || '0.0.0-ci' }}

  readme-sync:
    name: README quick start matches the consumer test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: python3 -I consumer-test/readme_sync.py README.md consumer-test/quickstart.c
