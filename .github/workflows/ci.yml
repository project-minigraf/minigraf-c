name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test (release.yml passes the pinned release tag)'
        required: false
        type: string
        default: ''

jobs:
  test:
    name: C tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -- --nocapture

  # Compiles a C program against include/minigraf.h and the static library and
  # runs it, so the header and the C calling convention are tested, not only Rust.
  c-smoke:
    name: C smoke test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Compile and run tests/c/etl_smoke.c
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -Iinclude tests/c/etl_smoke.c \
            target/release/libminigraf.a -lpthread -ldl -lm -o etl_smoke
          dir=$(mktemp -d)
          ./etl_smoke "$dir"

  check-header-drift:
    name: Verify minigraf.h is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.2 --locked
      - name: Regenerate header
        run: |
          cbindgen --config cbindgen.toml \
                   --crate minigraf-c-shim \
                   --output /tmp/minigraf_generated.h
      - name: Fail if header has drifted
        run: |
          diff include/minigraf.h /tmp/minigraf_generated.h || \
          (echo "minigraf.h is out of date — run cbindgen locally and commit the result" && exit 1)
