language = "C"
include_guard = "MINIGRAF_H"
autogen_warning = "/* DO NOT EDIT — generated by cbindgen. Run `cbindgen --config cbindgen.toml --crate minigraf-c-shim --output include/minigraf.h` to regenerate. */"
documentation = true
documentation_style = "c99"
usize_is_size_t = true

[export]
include = [
    "minigraf_open",
    "minigraf_open_in_memory",
    "minigraf_close",
    "minigraf_execute",
    "minigraf_string_free",
    "minigraf_checkpoint",
    "minigraf_last_error",
    "minigraf_open_with_options",
    "minigraf_current_tx_count",
    "minigraf_query",
    "minigraf_cursor_vars",
    "minigraf_cursor_next_batch",
    "minigraf_cursor_last_error",
    "minigraf_cursor_free",
    "minigraf_fact_log",
    "minigraf_fact_log_next_batch",
    "minigraf_fact_log_last_error",
    "minigraf_fact_log_free",
    "minigraf_log_writer_create",
    "minigraf_log_writer_append",
    "minigraf_log_writer_append_batch",
    "minigraf_log_writer_advance_tx_count",
    "minigraf_log_writer_tx_count",
    "minigraf_log_writer_finish",
    "minigraf_log_writer_last_error",
    "minigraf_log_writer_free",
    "MiniGrafDb",
    "MiniGrafCursor",
    "MiniGrafFactLog",
    "MiniGrafLogWriter",
]
