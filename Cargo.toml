[package]
name = "minigraf-c-shim"
version = "0.0.0"
edition = "2024"
publish = false
description = "C bindings for Minigraf — stable C API with cbindgen-generated header"
license = "MIT OR Apache-2.0"

[lib]
# "minigraf" produces libminigraf.so / libminigraf.dylib / minigraf.dll directly
name = "minigraf"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Unreleased v3 core (format v8). At the v3.0.0 release this goes back to an exact
# crates.io pin (minigraf = "=3.0.0"), which the release workflow updates.
minigraf = { git = "https://github.com/project-minigraf/minigraf", rev = "7c8c554096209ddc2bf1342b9a4eef3ef77c67c3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
members = ["."]
